<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <meta name="theme-color" content="#cfe6ff">
  <title>TAGME - ASUME</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="bokeh-circle bokeh-1"></div>
  <div class="bokeh-circle bokeh-2"></div>
  <div class="bokeh-circle bokeh-3"></div>
  <div class="bokeh-circle bokeh-4"></div>

  <div class="app-viewport">
    
    <header class="screen-header">
      <h1 class="brand-title">TAGME</h1>
      <p class="brand-slogan">Compañía que cuida, tecnología que acompaña</p>
      
      <div class="font-size-controls" aria-label="Ajuste de tamaño de texto">
        <button class="btn-pill-small" id="btn-font-dec" aria-label="Disminuir texto">A-</button>
        <button class="btn-pill-small" id="btn-font-inc" aria-label="Aumentar texto">A+</button>
      </div>
    </header>

    <main class="robot-stage-container" id="robot-container">
      <div class="robot-halo"></div>
      <img src="tagme-robot.png" alt="Robot TAGME" class="robot-image" id="tagme-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 200 200\'><text x=\'50%27 y=\'50%27 font-size=\'80\' text-anchor=\'middle\' dominant-baseline=\'middle\'>🤖</text></svg>'">
    </main>

    <section>
      <div class="dialogue-card" role="region" aria-live="polite">
        <p class="dialogue-text" id="dialogue-text">
          ¡Hola! Soy Tagme.<br>¿Cómo estás hoy?
        </p>
      </div>

      <div class="ia-status-row">
        <span class="status-dot" id="ia-status-dot"></span>
        <span id="ia-status-label">Verificando IA...</span>
      </div>

      <div class="actions-grid">
        <button class="btn-action-main btn-hablemos" id="btn-hablemos" aria-label="Hablar con TAGME">
          <span aria-hidden="true">🎤</span> Hablemos
        </button>
        <button class="btn-action-main btn-emergencia" id="btn-emergencia" aria-label="Emergencia">
          <span aria-hidden="true">🚨</span> Emergencia
        </button>
      </div>

      <button class="btn-action-repeat" id="btn-repetir" aria-label="Repetir último mensaje">
        <span aria-hidden="true">🔁</span> Repetir
      </button>

      <div class="secondary-nav">
        <button class="btn-text-nav" id="btn-open-agenda">📅 Recordatorios</button>
        <button class="btn-text-nav" id="btn-open-devices">⌚ Dispositivos</button>
      </div>
    </section>
  </div>

  <!-- MODAL: CONVERSACIÓN / HISTORIAL -->
  <div class="modal-overlay" id="modal-chat">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Conversando con TAGME</h2>
        <button class="btn-pill-small" id="btn-close-chat">Cerrar</button>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-input-bar">
        <input type="text" class="chat-input-field" id="chat-input-text" placeholder="Escribí tu mensaje..." aria-label="Escribir mensaje">
        <button class="btn-pill-small" id="btn-chat-send" style="background: var(--primary-celeste); color: #fff; border: none; padding: 0 20px;">Enviar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: RECORDATORIOS -->
  <div class="modal-overlay" id="modal-agenda">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Recordatorios del día</h2>
        <button class="btn-pill-small" id="btn-close-agenda">Cerrar</button>
      </div>
      <div id="agenda-list" style="overflow-y: auto; max-height: 280px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;"></div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="rem-text" class="chat-input-field" placeholder="Actividad o medicina">
        <input type="time" id="rem-time-val" class="chat-input-field" style="max-width: 120px;">
        <button class="btn-pill-small" id="btn-rem-add" style="background: var(--primary-celeste); color:#fff; border:none; padding: 0 16px;">+</button>
      </div>
    </div>
  </div>

  <!-- MODAL: FLUJO DE EMERGENCIA -->
  <div class="modal-overlay" id="modal-emergency-flow">
    <div class="modal-card" style="border-color: var(--alert-red); text-align: center;">
      <h2 style="color: var(--alert-red); font-size: 1.8rem; margin-bottom: 8px;">¿Necesitás ayuda?</h2>
      <p style="font-size: 1.15rem; color: #475569;">Tocá "Estoy bien" para cancelar. De lo contrario, se confirmará la solicitud.</p>
      <div style="font-size: 4rem; font-weight: 900; color: var(--alert-red); margin: 16px 0;" id="emergency-timer-num">15</div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn-action-main btn-hablemos" id="btn-cancel-alert" style="padding: 0 24px;">✅ Estoy bien</button>
        <button class="btn-action-main btn-emergencia" id="btn-confirm-alert" style="padding: 0 24px;">🚨 Confirmar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
